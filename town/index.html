@font-face{font-family:"Cubic11";src:url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@1.500/fonts/web/Cubic_11.woff2") format("woff2");font-display:swap}

.card,.drawer,#panel,#modal .card,.need{background:var(--box);color:#f4f1de;border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px rgba(0,0,0,.35)}
.card .mut,.drawer small,.need small,#note,.ev .tm,.day,.grp,.dsec{color:#b9c2e8}
h1,h2,h3,#here{text-shadow:2px 2px 0 var(--ink);letter-spacing:0}
button,#acts .act{font-family:inherit;color:#fff;background:#3a4a8c;border:3px solid var(--ink);border-radius:4px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.22),3px 3px 0 var(--ink);transition:transform .05s}
button:hover,#acts .act:hover{background:#4a5ca8}
button:active,#acts .act:active{transform:translate(3px,3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.22)}
button.pri,#acts .cta,.tabs button.on,.chips button.on{background:#ff4f7e;color:#fff;border-color:var(--ink)}
button.pri:hover,#acts .cta:hover{background:#ff6b93}
#acts .act small{color:#cfd6f5}#acts .cta small{color:#fff}
#acts .bad{background:#8c2a3a}#acts .bad small{color:#ffc2cc}#acts .poor{opacity:.5;filter:grayscale(.6)}#acts .ghost{background:#26306a;border-style:dashed;box-shadow:none}
#acts .ai img.px{width:30px;height:30px}#acts .cta .ai img.px{width:34px;height:34px}
.tabs{background:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:3px}.tabs button{box-shadow:none;background:transparent;border:2px solid transparent}.tabs button.on{border-color:#fff}
.chips button{border-radius:4px;box-shadow:2px 2px 0 var(--ink);padding:3px 9px}.chips button.on{border-color:#fff}
input,textarea{font-family:inherit;background:#0f1530;color:#fff;border:3px solid #fff;border-radius:4px;box-shadow:0 0 0 3px var(--ink)}
.need i{height:8px;border:2px solid var(--ink);border-radius:0;background:#0f1530}.need i b{background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.35) 6px 8px)!important}
.need span img.px{width:22px;height:22px}
.ev{border-bottom:2px dashed rgba(255,255,255,.12)}.ev .ic img.px{width:22px;height:22px}.ev.mine{background:rgba(76,217,100,.12)}.ev.bad{background:rgba(255,77,77,.12)}
.badge{border:2px solid var(--ink);border-radius:3px;background:#ff3b3b}
.drawer>button{background:transparent;box-shadow:none;border:2px solid transparent;color:#fff}.drawer>button:hover{background:#26306a;border-color:#fff}
.drawer>button::before{content:"▸ ";color:var(--gold);opacity:0}.drawer>button:hover::before{opacity:1}
.sw.on{outline:3px solid var(--gold)}.sw.dot{border:2px solid var(--ink)}
#toast{font-family:inherit;background:var(--box);border:3px solid #fff;box-shadow:0 0 0 3px var(--ink);border-radius:4px}
.big .ai img.px{width:34px;height:34px}
body.ingame .need{background:rgba(27,36,80,.88)}
/* ── 手機版分區：狀態列／工具列／地圖／抽屜，不再互相疊在一起 ── */
@media (max-width:700px){
 body.ingame{--hud:calc(env(safe-area-inset-top) + 58px);--tb:52px}
 body.ingame #needs{right:0;height:var(--hud);padding:calc(env(safe-area-inset-top) + 4px) 64px 4px 4px;background:var(--ink);border-bottom:3px solid #fff;gap:3px;align-items:stretch}
 body.ingame .need{box-shadow:none;border:2px solid #fff;padding:2px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
 body.ingame .need span{flex:none;height:16px;line-height:16px}body.ingame .need span img.px{width:16px;height:16px;display:block}body.ingame .need i{flex:none;height:6px;min-height:6px;width:86%;margin:1px 0;border-width:1px;box-sizing:border-box}body.ingame .need i b{display:block;height:100%}
 body.ingame .need small{font-size:11px;line-height:1.1}body.ingame .need.money small{margin-top:0}
 body.ingame .bar{top:calc(env(safe-area-inset-top) + 4px);right:4px}
 body.ingame #menuBtn{height:48px;width:54px;padding:2px;font-size:11px;line-height:1.2;background:#3a4a8c;border:2px solid #fff;box-shadow:none}
 body.ingame #strip{position:fixed;top:var(--hud);left:0;right:0;height:var(--tb);bottom:auto;z-index:19;margin:0;padding:4px 6px;right:auto;width:calc(100% - 184px);background:#141a3a;border-bottom:3px solid var(--ink);align-items:center;gap:4px;box-sizing:border-box}
 body.ingame #stage::before{content:"";position:fixed;left:0;right:0;top:var(--hud);height:calc(var(--tb) + 3px);background:#141a3a;border-bottom:3px solid var(--ink);z-index:18}
 body.ingame #strip button{background:#26306a;border:2px solid var(--ink);box-shadow:none;flex-direction:row;gap:3px;padding:1px 6px;height:44px;align-items:center}
 body.ingame #strip canvas{width:18px;height:26px}body.ingame #strip span{font-size:11px}
 body.ingame .tools{position:fixed;top:var(--hud);right:0;left:auto;height:var(--tb);padding:0 4px 0 6px;background:#141a3a;border-bottom:3px solid var(--ink);z-index:21;flex-direction:row;gap:4px;align-items:center}
 body.ingame .tools button{font-size:11px;padding:4px 5px;height:44px;min-width:44px;background:#3a4a8c;border:2px solid var(--ink);box-shadow:none;white-space:nowrap}
 body.ingame .tools button img.px{width:14px;height:14px;vertical-align:-2px}
 body.ingame #stage{top:calc(var(--hud) + var(--tb) + 3px);bottom:0}
 body.ingame #panel{border-width:3px 0 0;border-radius:0;box-shadow:0 -3px 0 var(--ink)}
 body.ingame #panel.min{padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
 body.ingame #tips,body.ingame #away{top:calc(var(--hud) + var(--tb) + 10px)}
}
/* ── 手機排版修正：選項按鈕上下排、觸控面積 ≥44px ── */
#mbody button.act{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;min-height:48px}#mbody button.act b,#mbody button.act small{display:block}#mbody button.act small{color:#cfd6f5;font-size:11px;line-height:1.35;margin-top:2px}
body.ingame #needs{grid-template-columns:repeat(6,minmax(0,1fr))}body.ingame .need{min-width:0;overflow:hidden}body.ingame .need.money small{white-space:normal;text-align:center;line-height:1.1}
#menuClose{min-width:44px;min-height:44px}#grip{min-height:44px}
@media (max-width:700px){.drawer>button{padding:9px 12px;min-height:44px}.dhead small{line-height:1.3}}
/* ── 按鈕回饋：按下亮框、成功閃綠、失敗搖晃、結果顯示在右上角（用 steps 保持像素感，不閃） ── */
#acts.busy .act{pointer-events:none}
#acts .act.working{outline:3px solid var(--gold);outline-offset:-3px;filter:brightness(1.2)}
#acts .act.ok{animation:okf .6s steps(4)}#acts .act.err{animation:errs .4s steps(4)}
@keyframes okf{0%{background:#2ecc71}60%{background:#2ecc71}100%{}}
@keyframes errs{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fb{float:right;margin:0 0 0 8px;padding:3px 8px;border:3px solid var(--ink);border-radius:4px;font-size:11px;line-height:1.4;max-width:62%;box-shadow:3px 3px 0 var(--ink)}
#fb.good{background:#2e7d4f;color:#fff}#fb.bad{background:#8c2a3a;color:#fff}#fb.hide{display:none}
@media (prefers-reduced-motion:reduce){#acts .act.ok,#acts .act.err{animation:none}}
.ld{text-align:center;padding:24px 0}.ld .ldp{font-size:44px;animation:ldh .8s steps(2) infinite}.ld b{display:block;font-size:22px;margin:8px 0 12px}.ld small{display:block;margin-top:10px}
.ldb{width:180px;height:14px;margin:0 auto;border:3px solid var(--ink);background:#fff}.ldb i{display:block;height:100%;width:30%;background:var(--gold);animation:ldm 1.2s steps(6) infinite}
@keyframes ldh{50%{transform:translateY(-6px)}}@keyframes ldm{0%{margin-left:0}100%{margin-left:70%}}
@media (prefers-reduced-motion:reduce){.ld .ldp,.ldb i{animation:none}}
</style>
</head>
<body>

 <section id="login"><div class="card" id="lg"><div class="ld"><div class="ldp">🐷</div><b>小豬鎮</b><div class="ldb"><i></i></div><small>載入中…</small></div></div></section>

   <div id="tab-feed"><div class="chips"><button data-ff="all" class="on">全部</button><button data-ff="me">跟我有關</button><button data-ff="good">好事</button><button data-ff="bad">壞事</button><button id="report" class="chip-r">🖼️ 日報圖</button></div><div id="feed"></div></div><div id="tab-rank" class="hide"></div><div id="tab-ppl" class="hide"></div></div>
 </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="hide"><div class="card" id="mbody"></div></div>
