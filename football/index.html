function value(p){const o=ovr(p),agef=p.age<21?1.6:p.age<25?1.3:p.age<29?1:p.age<32?.55:.2;return Math.max(.01,.25*Math.pow(1.165,o-50)*agef)} // 百萬歐元：能力 80 約 €25M，90 約 €110M

// ── 抉擇視窗 ──
function ask(q,opts,info){

  $("choice").innerHTML=`<h2 style="margin-top:10px">${q}</h2>${info?`<p class="mut">${info}</p>`:""}`+opts.map((o,i)=>{const ok=!o[3]||o[3]();return `<button class="opt" data-i="${i}" ${ok?"":"disabled"}>${o[0]}${o[2]?`<small>${o[2]}</small>`:""}</button>`}).join("");
  $("choice").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=opts[b.dataset.i],before=ovr(P);b.classList.add("picked");$("choice").querySelectorAll(".opt").forEach(x=>x.disabled=true);

}

// ── 育成計劃：每週 7 天的訓練表，決定哪些能力進步、累積多少疲勞 ──
const ACTS={
 技術:{w:{盤帶:.55,傳球:.45},fat:10,c:"#3fa7ff"},射門:{w:{射門:1},fat:10,c:"#ff4d4d"},體能:{w:{體能:.6,速度:.4},fat:16,c:"#4cd964"},
 防守:{w:{防守:1},fat:12,c:"#b07cff"},戰術:{w:{傳球:.5,防守:.5},fat:6,c:"#ffd23f"},撲救:{w:{防守:.8,速度:.2},fat:10,c:"#ff9f40",gk:1},
 讀書:{w:{},fat:-6,c:"#a9c2ad",study:1},休息:{w:{},fat:-22,c:"#556b5c"}};
const KID_ACTS=["技術","體能","讀書","休息"];
const PRESETS={均衡:["技術","體能","射門","休息","戰術","防守","休息"],進攻:["射門","技術","射門","休息","體能","射門","休息"],防守:["防守","戰術","防守","休息","體能","防守","休息"],恢復週:["技術","休息","戰術","休息","休息","體能","休息"],拚命練:["技術","體能","射門","防守","體能","技術","射門"]};
const DAYS=["一","二","三","四","五","六","日"];
let plan=PRESETS.均衡.slice();
function actsFor(p){return p.age<13?KID_ACTS:Object.keys(ACTS).filter(k=>(!ACTS[k].gk||p.pos=="GK")&&(!ACTS[k].study||p.age<20))}
function planShare(){const s={};ATTR.forEach(k=>s[k]=0);plan.forEach(d=>{for(const[k,v]of Object.entries(ACTS[d].w))s[k]+=v/7});return s}
function planFat(){return plan.reduce((a,d)=>a+ACTS[d].fat,0)}
// 一段時間（frac=一年中的比例）的成長與疲勞
function grow(p,minutes,frac=1){
 if(p.age<p.touchAge)return;
 const o=ovr(p),room=Math.max(0,p.pot-o),age=p.age,sh=planShare(),fat=p.fat||0;
 const env=(p.academy==5||(p.clubObj&&p.clubObj.tier>=4))?1:clamp(.72+(p.cs-50)/140,.72,1); // 足球環境：強國或頂級聯賽練得比較快
 let base=(age<8?2.6:age<12?3.4:age<17?3.2:age<21?2.4:age<25?1.4:age<29?.4:age<32?-.8:-(age-29)*.9);if(base>0)base*=env;
 if(age>=12&&age<29)base*=.6+.6*Math.min(1,room/12)+minutes*.4;
 const tired=fat>80?.55:fat>60?.85:1;
 for(const k of ATTR){let d=base>0?base*frac*(.7+R()*.6)*(.8+4.2*sh[k])*tired:base*frac*(.7+R()*.6)+frac*2.2*sh[k]*tired;
  if((k=="速度"||k=="體能")&&age>=29)d-=frac*(age-28)*.25*(sh.體能>.15?.6:1);
  if(p.pos=="GK"&&k=="射門")d*=.2;p.a[k]=clamp(p.a[k]+d,5,99)}
 const now=ovr(p);if(now>p.pot)ATTR.forEach(k=>p.a[k]-=(now-p.pot)*.5);
 // 疲勞：一週總負荷超過 30 就會累積
 p.fat=clamp(fat+(planFat()-30)*frac*4,0,100);const rest=plan.filter(d=>d=="休息").length;
 if(rest>=2)p.health=Math.min(100,p.health+frac*12);if(rest==0)p.morale-=frac*6;
 if(plan.includes("讀書")&&p.age<20)p.grade=clamp((p.grade||60)+frac*plan.filter(d=>d=="讀書").length*3-frac*3,0,100);
}
// 小孩子沒有「訓練」，只有放學後的時間怎麼用；13 歲進青訓才有正式課表

 $("focus").innerHTML=`<div class="days">${plan.map((d,i)=>`<button class="day" data-i="${i}" style="--c:${ACTS[d].c}"><span>週${DAYS[i]}</span><b>${kid?KID_NAME[d]||d:d}</b></button>`).join("")}</div>
  <div class="presets">${p.age<13?"":Object.keys(PRESETS).map(k=>`<button class="pre" data-k="${k}">${k}</button>`).join("")}</div>
  ${kid?"":`<div class="plan-sum"><span>每週負荷 <b style="color:${load[1]}">${load[0]}</b></span><span>目前疲勞 <b style="color:${(p.fat||0)>70?"var(--ac)":"var(--fg)"}">${Math.round(p.fat||0)}</b></span>${ATTR.map(k=>`<span>${k} ${"▮".repeat(Math.round(sh[k]*14))||"·"}</span>`).join("")}</div>`}`;
 $("focus").querySelectorAll(".day").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,cur=acts.indexOf(plan[i]);plan[i]=acts[(cur+1)%acts.length];renderPlan()});

}

function injuryCheck(frac){const p=P;const risk=(.1+Math.max(0,p.age-28)*.02+(p.a.體能<50?.03:0))*frac+Math.max(0,(p.fat||0)-65)/220*frac*4;

async function season(){
 const p=P;p.age++;
 heightYear(p);

 if(p.age==13){await academy();say("開始有正式的訓練課表了：射門、防守、戰術都能排進每週計劃。");toast("育成計劃解鎖更多訓練項目")}

 if(p.club&&!p.retired)await proSeason();else if(!p.retired){await youthYear(p.stage=="青訓"?.6:.3);if(p.age>=19&&!p.club){await amateur()}}
 if(p.retired)await afterLife();
 p.ovrHist[p.age]=ovr(p);p.peak=Math.max(p.peak,ovr(p));p.maxValue=Math.max(p.maxValue,value(p));
}
// ── 身高：照生長曲線長高，青春期會突然抽高（晚熟的人晚一兩年）──
const HCURVE=[[0,.285],[1,.43],[2,.495],[3,.545],[4,.585],[5,.625],[6,.66],[7,.695],[8,.73],[9,.76],[10,.79],[11,.815],[12,.84],[13,.875],[14,.92],[15,.955],[16,.98],[17,.993],[18,1]];
function hAt(p,age){const x=Math.max(0,age-(age>=11?p.bloom:0));const i=Math.min(17,Math.floor(x)),f=x-i;const [,a]=HCURVE[i],[,b]=HCURVE[Math.min(18,i+1)];return p.hT*(a+(b-a)*f)}
function heightYear(p){const before=p.h;p.h=Math.round(hAt(p,p.age)*10)/10;const d=p.h-before;
 if(p.age>=12&&p.age<=17&&d>=8){say(`這一年長高了 ${Math.round(d)} 公分，膝蓋常常痠痛，動作也變得有點不協調。`);p.a.盤帶-=1.5;p.a.速度+=1}

async function firstContract(){
 const p=P,o=ovr(p);const weak=p.cs<65,seen=c=>c.ct==p.c||p.academy==5||(p.scouted&&!weak)||o>=c.str-(weak?3:8); // 國外球隊要先被球探看到；足球弱國的球員更難被注意
 const offers=CLUBS.filter(c=>c.str-12<=o+(p.academy||0)*1.2&&c.str-14<=o&&seen(c)).sort((a,b)=>b.str-a.str);
 const home=offers.filter(c=>c.ct==p.c),abroad=offers.filter(c=>c.ct!=p.c);
 const list=[...new Set([home[0],abroad[0],abroad[1],home[1]].filter(Boolean))].slice(0,3);
 if(!list.length){say("沒有職業球隊開出合約。");return}
 await ask(`${p.age} 歲，職業俱樂部遞出合約`,list.map(c=>[`${c.name}（${c.lg}）`,()=>sign(c,3),`球隊實力 ${c.str} · ${roleOf(p,c)}起步 · 週薪約 ${eur(wageOf(c,p)/52)}`]).concat([["先不簽，繼續練一年",()=>{p.a.體能+=2},"之後可能有更好的合約，也可能沒有"]]));
}
// 在球隊裡的角色：實力差太多只能待預備隊，不會出賽職業比賽

 for(let i=0;i<3;i++){const ox=W-90+i*22,oy=H/2+Math.sin(t+i*2)*40;g.fillStyle="#335";g.fillRect(ox-3,oy-4,7,7);g.fillStyle="#111";g.fillRect(ox-2,oy+3,2,4);g.fillRect(ox+1,oy+3,2,4)}
 g.fillStyle="#ffd23f";g.font="10px monospace";g.fillText(`GOAL ${goals||0}`,10,18)}
let liveGoals=0;
async function playPhase(ph,st,apps){
 if(toEnd)return;const p=P,total=secPerSeason*250;let w=0,last=performance.now();
 while(w<total){await new Promise(r=>setTimeout(r,50));const now=performance.now();if(!paused)w+=(now-last)*mult;last=now;if(pendingSkip||toEnd)w=total;
  const t=Math.min(1,w/total);$("ticker").textContent=`${p.y0+p.age} 球季 · ${p.phase} · 已出賽 ${st.apps} / ${apps} 場 · ${p.pos=="GK"?`零封 ${st.cleans}`:`進球 ${st.goals} · 助攻 ${st.assists}`} · 疲勞 ${Math.round(p.fat||0)}`;
  $("sFill").style.width=((ph+t)/4*100)+"%";drawPitch((ph+t)/4,st.goals)}
}
async function playSeasonVisual(apps,goals){
 if(toEnd)return;const p=P,total=secPerSeason*1000;let w=0,last=performance.now(),shown=0;
 while(w<total){await new Promise(r=>setTimeout(r,50));const now=performance.now();if(!paused)w+=(now-last)*mult;last=now;if(pendingSkip||toEnd)w=total;
  const t=Math.min(1,w/total),m=Math.min(11,Math.floor(t*10));const g2=Math.round(goals*t);
  if(g2>shown){shown=g2;toast(`⚽ 進球！本季第 ${shown} 球`)}$("ticker").textContent=`${p.y0+p.age} 球季 · 第 ${Math.round(apps*t)} 場 / ${apps} 場 · ${p.pos=="GK"?"":`進球 ${g2}`}`;
  $("sFill").style.width=t*100+"%";drawPitch(t,g2)}
}
async function quietYear(){if(toEnd)return;const total=secPerSeason*(P.retired?90:P.age<17?400:300);let w=0,last=performance.now();while(w<total){await new Promise(r=>setTimeout(r,50));const now=performance.now();if(!paused)w+=(now-last)*mult;last=now;if(pendingSkip||toEnd)w=total;$("sFill").style.width=Math.min(100,w/total*100)+"%";if(P.age<13)$("ticker").textContent=P.age<P.touchAge?`${P.age} 歲，還沒碰過足球`:`${P.age} 歲 · ${P.stage} · 身高 ${Math.round(P.h)} 公分`;drawPitch(Math.min(1,w/total),0)}}
function render(){
 const p=P,o=ovr(p);$("ovr").textContent=p.age<p.touchAge?"??":Math.round(o);$("pos").textContent=p.pos;$("nm").textContent=p.name.split(" ").pop();$("age").textContent=p.age;
 $("fut").className="fut"+(o>=75?"":o>=65?" silver":" bronze");$("who").textContent=`${p.name}（${POS[p.pos]}）`;
 $("where").textContent=p.retired?`已退休 · ${p.after||""}`:p.club?`${p.club} · ${p.clubObj.lg} · 合約剩 ${Math.max(0,p.contract)} 年`:`${p.c} · ${p.stage}`;
 $("sL").textContent=`${p.age} 歲`;$("sR").textContent=`${p.age+1} 歲`;drawFace($("face"),p);
 $("stats").innerHTML=(p.age<p.touchAge?`<div class="stat" style="grid-column:1/-1"><span>足球能力</span><b>還沒碰過足球</b></div>`:"")+ATTR.filter(()=>p.age>=p.touchAge).map(k=>`<div class="stat"><span>${k}</span><b>${Math.round(p.a[k])}</b><div class="bar"><i style="width:${p.a[k]}%"></i></div></div>`).join("")+
  `<div class="stat"><span>身高</span><b>${Math.round(p.h)} cm</b></div>`+(p.age<13?`<div class="stat"><span>功課</span><b>${Math.round(p.grade||60)}</b></div><div class="stat"><span>健康</span><b>${Math.round(p.health)}</b></div>`:`<div class="stat"><span>身價</span><b>${p.club?eur(value(p)):"—"}</b></div><div class="stat"><span>年薪</span><b>${p.club?eur(p.wage):"—"}</b></div><div class="stat"><span>存款</span><b>${eur(Math.max(0,p.money))}</b></div><div class="stat"><span>健康</span><b>${Math.round(p.health)}</b><div class="bar"><i style="width:${p.health}%"></i></div></div><div class="stat"><span>疲勞</span><b style="color:${(p.fat||0)>70?"var(--ac)":"var(--fg)"}">${Math.round(p.fat||0)}</b><div class="bar"><i style="width:${p.fat||0}%;background:var(--ac)"></i></div></div><div class="stat"><span>名氣</span><b>${Math.round(p.fame)}</b></div><div class="stat"><span>天賦上限</span><b>${p.age<16?"？？":Math.round(p.pot)}</b></div>`);
 $("career").innerHTML=[["出賽",p.apps],[p.pos=="GK"?"零封":"進球",p.pos=="GK"?p.cleans:p.goals],["助攻",p.assists],["國家隊出賽",p.caps],["冠軍",p.trophies.length],["個人獎項",p.awards.length]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");
 $("ovrChart").innerHTML=chart(p.ovrHist,"能力值");
}
function chart(arr,label){const v=arr.map((x,i)=>[i,x]).filter(x=>x[1]!=null);if(v.length<2)return"";const W=300,H=80,n=Math.max(40,v[v.length-1][0]);const pts=v.map(([i,x])=>`${(i/n*W).toFixed(1)},${(H-x/100*H).toFixed(1)}`).join(" ");const pk=v.reduce((a,b)=>b[1]>a[1]?b:a);
 return `<div class="mut" style="font-size:13px">${label}　最高 ${Math.round(pk[1])}（${pk[0]} 歲）</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#ffd23f" stroke-width="2.5"/></svg>`}

// ── 主迴圈 ──
async function loop(){
 while(P.alive){
  if(P.club&&!P.retired)await season();else{await quietYear();await season()}
  pendingSkip=false;render();renderPlan();save();
 }
 finish();
}
function save(){try{localStorage.setItem("fb-save",JSON.stringify({P,plan}))}catch{}}
function score(p){return Math.round(p.peak*1.2+p.trophies.length*8+p.awards.length*12+p.caps*.3+p.goals*.15+(p.wc||0)*6)}
function finish(){
 try{localStorage.removeItem("fb-save")}catch{}
 const p=P;$("game").classList.add("hide");$("end").classList.remove("hide");scrollTo(0,0);
 const sc=score(p),title=p.awards.some(a=>a[1]=="世界足球先生")?"世界足球先生":p.trophies.some(t=>t[1]=="世界盃冠軍")?"世界冠軍":p.peak>=85?"一代球星":p.peak>=75?"職業好手":p.clubsPlayed.length?"職業球員":"追夢的人";
 const tro=p.trophies.reduce((a,[,t])=>(a[t]=(a[t]||0)+1,a),{});
 $("cert").innerHTML=`<h2>足球生涯證書</h2><div style="display:flex;gap:14px;align-items:center"><canvas id="cface" width="16" height="16" style="width:84px;height:84px;image-rendering:pixelated;border:3px solid #16241a"></canvas><div><div style="font-size:28px;font-weight:900">${esc(p.name)}</div><div>${p.y0} — ${p.y0+p.age} · ${p.c} · ${POS[p.pos]}</div><div style="background:#16241a;color:#ffd23f;display:inline-block;padding:2px 8px;margin-top:4px">${title}</div></div></div>
 <div class="grid" style="margin:12px 0">${[["生涯評分",sc],["巔峰能力",Math.round(p.peak)],["出賽",p.apps],[p.pos=="GK"?"零封":"進球",p.pos=="GK"?p.cleans:p.goals],["助攻",p.assists],["國家隊",`${p.caps} 場 ${p.intlGoals} 球`],["最高身價",eur(p.maxValue)],["待過的球隊",p.clubsPlayed.length],["受傷",p.injuries+" 次"],["退休",p.retireAge?p.retireAge+" 歲":"—"],["之後",p.after||"—"],["享年",p.age+" 歲"]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("")}</div>
 <div><b>榮譽</b>　<span class="trophies">${"🏆".repeat(Math.min(15,p.trophies.length))}${"🥇".repeat(Math.min(8,p.awards.length))}</span></div>
 <div class="mut" style="font-size:13px">${Object.entries(tro).map(([t,n])=>`${t} ×${n}`).join("、")||"沒有冠軍"}${p.awards.length?"；"+[...new Set(p.awards.map(a=>a[1]))].join("、"):""}</div>
 <div style="margin:8px 0;padding:8px;background:#16241a;color:#f4f1de">${(()=>{const od=realOdds(p.c),t5=p.clubsPlayed.some(n=>{const c=CLUBS.find(x=>x.name==n);return c&&TOP5.includes(c.lg)}),pro=!!p.debut;
  return t5?`你踢進了五大聯賽。在真實的${p.c}，同年出生的男孩約 ${oneIn(od.top5)} 做得到。`:pro?`你踢上了職業一線隊。在真實的${p.c}，同年出生的男孩約 ${oneIn(od.pro)} 做得到。`:`你沒能踢上職業一線隊。在真實的${p.c}，也只有約 ${oneIn(od.pro)} 能成為職業球員。`})()}</div>
 <div><b>效力過</b>　${p.clubsPlayed.join(" → ")||"沒有職業球隊"}</div>
 <div class="chart" style="margin-top:10px">${chart(p.ovrHist,"能力值變化")}</div>`;
 drawFace($("cface"),p);
 $("seasons").innerHTML=p.seasons.map(s=>`<div class="row"><span>${s.y}（${s.age}歲）${s.club}</span><span>${s.apps} 場 · ${s.goals} 球 · 評分 ${s.rating}${s.titles.length?" · 🏆":""}</span></div>`).join("")||"<p class='mut'>沒有職業球季。</p>";
 try{const h=JSON.parse(localStorage.getItem("fb-hof")||"[]");h.push({name:p.name,c:p.c,pos:p.pos,sc,title,peak:Math.round(p.peak),goals:p.goals,tro:p.trophies.length,y:`${p.y0}–${p.y0+p.age}`});h.sort((a,b)=>b.sc-a.sc);localStorage.setItem("fb-hof",JSON.stringify(h.slice(0,20)))}catch{}
 $("share").onclick=async()=>{const text=`我在足球員模擬器踢了一生：${p.name}（${p.c}·${POS[p.pos]}），巔峰能力 ${Math.round(p.peak)}，${p.goals} 球、${p.trophies.length} 座冠軍。${location.href.split("?")[0]}`;try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);toast("已複製分享文字")}}catch{}};
}

// ── 揭曉 ──
function reveal(p){return new Promise(res=>{const ov=document.createElement("div");ov.id="reveal";
 ov.innerHTML=`<div><div class="mut" style="margin-bottom:10px">— 一位未來的足球員誕生了 —</div><div class="slot" id="rvN">？？？</div><div id="rvS" style="margin:14px 0"></div><button class="pri hide" id="rvGo">開始踢球 ▶</button><br><button id="rvSkip" style="background:none;border:0;box-shadow:none;color:var(--mut);text-decoration:underline">跳過</button></div>`;
 document.body.appendChild(ov);let t=0,d=40,done=false;const n=ov.querySelector("#rvN");
 const spin=()=>{if(done)return;n.textContent=wpick(COUNTRIES,x=>x[1])[0];t+=d;d*=1.1;if(t>2400){n.textContent=p.c;n.style.color="var(--y)";stamps();return}setTimeout(spin,d)};spin();
 function stamps(){const od=realOdds(p.c);ov.querySelector("#rvS").insertAdjacentHTML("beforebegin",`<p class='mut' style='max-width:420px;margin:10px auto'>真實世界裡，${p.c}同年出生的約 ${Math.round(od.boys/1e4)} 萬名男孩中：成為職業球員約 <b style='color:var(--y)'>${oneIn(od.pro)}</b>，踢進五大聯賽約 <b style='color:var(--y)'>${oneIn(od.top5)}</b>。</p>`);const it=[["位置",POS[p.pos]],["國家隊強度",p.cs],["家境",["貧困","偏低","中等","小康","富裕"][p.cls]],["天賦",p.talent>=70?"罕見":p.talent>=60?"不錯":p.talent>=50?"普通":"平庸"]];
  it.forEach(([k,v],i)=>setTimeout(()=>{const s=document.createElement("span");s.className="stamp";s.innerHTML=`<span>${k}</span><b>${v}</b>`;ov.querySelector("#rvS").appendChild(s);if(i==it.length-1)ov.querySelector("#rvGo").classList.remove("hide")},300+i*320))}
 const close=()=>{done=true;ov.remove();res()};ov.querySelector("#rvGo").onclick=close;ov.querySelector("#rvSkip").onclick=close})}

// ── 首頁 ──
const cfg={w:"world",pos:"FW"};
document.querySelectorAll(".w").forEach(b=>b.onclick=()=>{document.querySelectorAll(".w").forEach(x=>x.classList.remove("on"));b.classList.add("on");cfg.w=b.dataset.v});
document.querySelectorAll(".p").forEach(b=>b.onclick=()=>{document.querySelectorAll(".p").forEach(x=>x.classList.remove("on"));b.classList.add("on");cfg.pos=b.dataset.v});
document.querySelectorAll(".s").forEach(b=>b.onclick=()=>{document.querySelectorAll(".s").forEach(x=>x.classList.remove("on"));b.classList.add("on");secPerSeason=+b.dataset.v});
document.querySelectorAll(".sp").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sp").forEach(x=>x.classList.remove("on"));b.classList.add("on");mult=+b.dataset.m});
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶ 繼續":"⏸ 暫停"};
$("skipQ").onclick=()=>{pendingSkip=true};
$("auto").onchange=e=>{auto=e.target.checked;toast(auto?"之後的抉擇自動決定":"之後的抉擇由你決定")};
$("skipEnd").onclick=e=>{const b=e.currentTarget;if(!b.dataset.arm){b.dataset.arm=1;b.textContent="再按一次確認";setTimeout(()=>{delete b.dataset.arm;if(!toEnd)b.textContent="⏩ 跳到結局"},3000);return}
 toEnd=true;b.textContent="⏩ 快速跑完中…";const open=!$("modal").classList.contains("hide")&&[...$("choice").querySelectorAll(".opt:not([disabled])")];if(open&&open.length)pick(open).click()};
function start(p){P=p;$("home").classList.add("hide");$("game").classList.remove("hide");scrollTo(0,0);renderPlan();render();loop()}
$("go").onclick=async()=>{const p=newPlayer(cfg.w,cfg.pos);P=p;await reveal(p);say(`${p.name}出生在${p.c}。`,1);start(p)};
try{const s=JSON.parse(localStorage.getItem("fb-save"));if(s&&s.P&&s.P.alive){$("resume").innerHTML=`<button id="rs">繼續 ${esc(s.P.name)}（${s.P.age} 歲）</button>`;$("rs").onclick=()=>{if(s.plan)plan=s.plan;const p=s.P;if(p.club)p.clubObj=CLUBS.find(c=>c.name==p.club);$("log").innerHTML=p.log.slice(-60).reverse().map(([a,t,h])=>`<p class="${h?"hi":""}"><span class="y">${a}歲</span>${t}</p>`).join("");start(p)}}}catch{}
try{const h=JSON.parse(localStorage.getItem("fb-hof")||"[]");$("hof").innerHTML=h.length?h.map(x=>`<div class="stat"><span>${esc(x.title)} · ${x.y}</span><b>${esc(x.name)}</b><span>${esc(x.c)} · ${x.pos} · 巔峰 ${x.peak} · ${x.goals} 球 · 🏆${x.tro}</span><span>生涯評分 ${x.sc}</span></div>`).join(""):"<p class='mut'>還沒有踢完的生涯。</p>"}catch{}
$("oddsTbl").innerHTML="<b>真實世界的機率（概估）</b><br>"+["巴西","英格蘭","西班牙","日本","中國","台灣"].map(c=>{const o=realOdds(c);return `${c}：職業球員 ${oneIn(o.pro)}、五大聯賽 ${oneIn(o.top5)}`}).join("<br>");
drawPitch(0,0);
</script></body></html>
